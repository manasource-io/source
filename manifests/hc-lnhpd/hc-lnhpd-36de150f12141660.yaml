notice: "This Information has been modified from the original published by Health Canada: columns are selected, product names are normalized and their whitespace collapsed, rows that could not be resolved are held back, and dose units are mapped onto the closed corpus fact vocabulary. It is not represented as an official version of the Information, nor as one endorsed by Health Canada or by the Government of Canada. Imported from complete bulk downloads of the official LNHPD productlicence and productdose endpoints, each verified whole against the content-length its own response declared and recorded by SHA-256 digest in the acquisition report beside this manifest. This batch publishes exactly the licensed products carrying at least one dose row whose unit of measure is a mass or volume the corpus fact vocabulary holds; resolved products with no such dose row are counted and held rather than published as identity rows carrying no fact, and every held row states its reason. The LNHPD medicinalingredient and productrisk datasets were not acquired, so this batch claims nothing about ingredient content, potency, cautions, contra-indications or adverse reactions. Every emitted value is attributed reference data. A record cites Health Canada's product page for the licence, and a dose range cites the product's own rows in the dose dataset, because a licence attested to an NHPD monograph shows no numbers on its page and a citation a reader cannot check is a citation in form only. A dose range is what a licence holder stated on a product, reproduced with its own attribution and citation — it is not a recommendation, an intake target, an upper limit or an evidence claim, and no fact, report or artifact on this path reaches an evidence score, benefit or evidence grade, ranking, resource association, recommendation or any app mechanic."
