    value: PULMONARY SURFACTANT WHICH IS A NATURAL BOVINE LUNG EXTRACT CONTAINING PHOSPHOLIPIDS, NEUTRAL LIPIDS, FATTY ACIDS, AND SURFACTANT-ASSOCIATED PROTEINS (SP) TO WHICH COLFOSCERIL PALMITATE (DIPALMITOYLPHOSPHATIDYLCHOLINE), PALMITIC ACID, AND TRIPALMITIN ARE ADDED TO STANDARDIZE THE COMPOSITION AND TO MIMIC SURFACE-TENSION LOWERING PROPERTIES OF NATURAL LUNG SURFACTANT. THE RESULTING COMPOSITION PROVIDES 25 MG/ML OF PHOSPHOLIPIDS (INCLUDING 11.0-15.5 MG/ML OF DISATURATED PHOSPHATIDYLCHOLINE), 0.5-1.75 MG/ML OF TRIGLYCERIDES, 1.4-3.5 MG/ML OF FREE FATTY ACIDS, AND LESS THAN 1 MG/ML OF SP-C
